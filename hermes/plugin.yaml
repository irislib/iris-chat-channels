name: iris-chat-channel
label: Iris Chat
kind: platform
version: 0.2.2
requires_hermes: ">=0.22.5"
description: Signal-like Iris messaging with Nostr Double Ratchet encryption, without phone numbers or signup.
author: Iris
license: MIT
homepage: https://irischat.org
tags: [gateway, messaging, iris, nostr]
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env: []
optional_env:
  - name: IRIS_CHANNEL_STATE_DIR
    description: Dedicated persistent Iris channel directory, created by gateway setup.
    password: false
  - name: IRIS_CHANNEL_BRIDGE_URL
    description: Optional isolated loopback transport for managed containers.
    password: false
  - name: IRIS_CHANNEL_OWNER
    description: Approved contact selected during setup; used for scheduled delivery.
    password: false
